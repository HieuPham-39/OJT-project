<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Allow root and automotive user to own the service -->
  <policy user="root">
    <allow own="org.automotive.MediaManager"/>
    <allow send_destination="org.automotive.MediaManager"/>
    <allow receive_sender="org.automotive.MediaManager"/>
  </policy>

  <!-- Default permissions: allow processes to call methods and receive signals -->
  <policy context="default">
    <allow own="org.automotive.MediaManager"/>
    <allow send_destination="org.automotive.MediaManager"/>
    <allow receive_sender="org.automotive.MediaManager"/>
  </policy>
</busconfig>
